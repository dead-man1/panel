# Load every dashboard JSON in the mounted directory — nx-fleet.json (the
# panel) and nx-insight.json (NX Insight's paths, empty without its job in
# prometheus.yml). `foldersFromFilesStructure` is off: there is no folder tree
# to mirror.
apiVersion: 1

providers:
  - name: nx
    orgId: 1
    folder: NX
    type: file
    disableDeletion: false
    # Re-read the files periodically, so editing the JSON on disk and waiting is
    # enough — no restart.
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
